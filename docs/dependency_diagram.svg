  <text x="795" y="450" text-anchor="middle" font-size="18" font-weight="700" fill="#2c3e50">InMemoryDatabase</text>
  <text x="795" y="473" text-anchor="middle" font-size="13" fill="#5a6b80">implements database&lt;%&gt;</text>

