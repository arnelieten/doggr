<svg xmlns="http://www.w3.org/2000/svg" width="2120" height="1800" viewBox="0 0 1060 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1060" height="900" fill="#ffffff"/>

  <text x="530" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#2c3e50">Pedigree Dog App</text>

